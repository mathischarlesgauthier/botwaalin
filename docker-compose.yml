services:
  agent:
    build: .
    container_name: arbi-jacob-wa-agent
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      PORT: "3000"
      DB_PATH: /app/data/agent.db
      CATALOGUE_PATH: /app/data/catalogue.md
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
